# Local production simulation: Postgres + API + looping collector.
# Real production wiring lives in .github/workflows/ + deploy/cloud-run/.
# Usage:
#   POSTGRES_PASSWORD=... docker compose -f deploy/docker-compose.yml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: final_trades
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector -d final_trades"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: serve
    environment:
      DATABASE_URL: postgresql+psycopg://collector:${POSTGRES_PASSWORD}@db:5432/final_trades
      API_HOST: 0.0.0.0
      API_CORS_ORIGINS: http://localhost:8000
      DB_QUERY_TIMEOUT_MS: "5000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  collector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # Simulation loop; production uses GitHub Actions cron (free, monitored).
    command: ["sh", "-c", "while true; do final-trades collect --once || echo 'run exited non-zero (partial/failed) — recovery is automatic next cycle'; sleep ${COLLECT_INTERVAL_SECONDS:-21600}; done"]
    environment:
      DATABASE_URL: postgresql+psycopg://collector:${POSTGRES_PASSWORD}@db:5432/final_trades
      BACKLOG_MAX_DATES_PER_RUN: "40"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
