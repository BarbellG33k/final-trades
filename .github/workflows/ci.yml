name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --extra postgres
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Types (mypy --strict)
        run: uv run mypy
      - name: Tests + coverage (fixtures only, no network)
        run: uv run pytest tests -q --cov --cov-report=term-missing -m "not live"
      - name: Dependency vulnerabilities (pip-audit)
        run: uvx pip-audit
      - name: License audit
        run: |
          uv run --with pip-licenses pip-licenses --format=plain \
            --fail-on="GNU General Public License v3 (GPLv3);GNU Affero General Public License v3"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check + build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx vitest run
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -f deploy/Dockerfile -t final-trades:ci .
      - name: Smoke: migrations + API boot inside container
        run: |
          docker run -d --name ft -p 8123:8000 \
            -e DATABASE_URL=sqlite:////tmp/ft.sqlite3 \
            -e API_HOST=0.0.0.0 final-trades:ci serve
          sleep 12
          curl -fsS http://localhost:8123/healthz
          curl -fsS http://localhost:8123/api/v1/overview | head -c 200
          docker logs ft | tail -5
