[project]
name = "final-trades"
version = "0.1.0"
description = "Collects, organizes, and analyzes CNBC Final Trade recommendations from Halftime Report and Fast Money."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Final Trade Intelligence Platform contributors" }]
keywords = ["cnbc", "final-trade", "halftime-report", "fast-money", "finance"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "curl_cffi>=0.7",
    "selectolax>=0.3.21",
    "feedparser>=6.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
final-trades = "final_trades.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/final_trades"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["final_trades"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["feedparser", "selectolax.*", "curl_cffi.*", "yfinance"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--strict-markers -q"
markers = [
    "integration: tests that touch the database or multiple modules",
    "live: tests that hit the network (excluded from normal CI runs)",
]

[tool.coverage.run]
source = ["src/final_trades"]
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 90
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
